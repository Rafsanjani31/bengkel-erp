version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bengkel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-bengkel_erp}
      MYSQL_USER: ${DB_USER:-bengkel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      TZ: 'Asia/Jakarta'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bengkel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: bengkel-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DB_HOST: mysql
      DB_USER: ${DB_USER:-bengkel}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-bengkel_erp}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - bengkel-network
    restart: unless-stopped
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: bengkel-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bengkel-network
    restart: unless-stopped
    command: npm run dev

  # PhpMyAdmin (Optional - untuk management database)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bengkel-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER:-bengkel}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
      PMA_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - bengkel-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  bengkel-network:
    driver: bridge
